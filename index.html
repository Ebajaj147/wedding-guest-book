utton{border:1px solid var(--line);background:var(--paper);padding:5px 13px;color:var(--plum);font-size:12px}iframe{display:block;width:100%;height:calc(100vh - 50px);height:calc(100dvh - 50px);border:0;background:var(--paper)}@media(max-width:480px){.card{padding:32px 24px}.entry{padding:20px}h1{font-size:38px}}@media print{.bar,.entry{display:none!important}iframe{height:100vh}}

<main id="entry" class="entry">
 <section class="card" aria-labelledby="heading">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg></div>
  <div class="eyebrow">A little planning, together</div>
  <h1 id="heading">The guest book</h1>
  <p>Enter the shared password to open our wedding guest planner.</p>
  <form id="form">
   <label for="password">Password</label>
   <div class="password-row"><input id="password" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="none" aria-describedby="error"><button id="show" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
   <button id="unlock" type="submit">Open guest book</button>
   <p id="error" role="alert" hidden></p>
   <div id="status" role="status" aria-live="polite"></div>
  </form>
  <div class="note">Use Lock when you’re finished on a shared device.</div>
  <noscript><p>Enable JavaScript to unlock the guest book.</p></noscript>
 </section>
</main>

<script>
(() => {
 'use strict';
 const $ = id => document.getElementById(id);
 const payload = JSON.parse($('encrypted-data').textContent);
 const decode = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
 const field = $('password');
 let generation = 0;
 function lock() {
  generation++;
  $('frame').removeAttribute('srcdoc');
  $('frame').src = 'about:blank';
  $('book').hidden = true;
  $('entry').hidden = false;
  field.value = '';
  field.type = 'password';
  $('show').textContent = 'Show';
  $('show').setAttribute('aria-label', 'Show password');
  $('show').setAttribute('aria-pressed', 'false');
  $('status').textContent = '';
  $('error').hidden = true;
  $('unlock').disabled = false;
  field.focus();
 }
 $('form').addEventListener('submit', async event => {
  event.preventDefault();
  if ($('unlock').disabled) return;
  const attempt = ++generation;
  $('error').hidden = true;
  $('unlock').disabled = true;
  $('status').textContent = 'Opening your guest book…';
  try {
   if (!window.crypto?.subtle) throw new Error('unsupported');
   const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
   const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'}, material, {name:'AES-GCM',length:256}, false, ['decrypt']);
   const plaintext = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)}, key, decode(payload.ciphertext));
   if (attempt !== generation) return;
   $('frame').srcdoc = new TextDecoder().decode(plaintext);
   field.value = '';
   $('entry').hidden = true;
   $('book').hidden = false;
   $('status').textContent = '';
   $('lock').focus();
  } catch (error) {
   if (attempt !== generation) return;
   $('error').textContent = error.message === 'unsupported' ? 'Please open this page over HTTPS in an up-to-date browser.' : 'That password didn’t open the guest book. Please try again.';
   $('error').hidden = false;
   $('status').textContent = '';
   field.focus();
   field.select();
  } finally {
   if (attempt === generation) $('unlock').disabled = false;
  }
 });
 $('show').addEventListener('click', () => {
  const show = field.type === 'password';
  field.type = show ? 'text' : 'password';
  $('show').textContent = show ? 'Hide' : 'Show';
  $('show').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  $('show').setAttribute('aria-pressed', String(show));
 });
 $('lock').addEventListener('click', lock);
 window.addEventListener('pagehide', lock);
 window.addEventListener('pageshow', event => { if (event.persisted) lock(); });
})();
</script>
